# Put this file in your repo at:  .github/workflows/check.yml
name: Check Global Entry appointments

on:
  schedule:
    - cron: "0 * * * *"    # every hour on the hour (times are UTC)
  workflow_dispatch:         # adds a "Run workflow" button for manual runs
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false

permissions:
  contents: write            # lets the job save state.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for openings
        run: python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_MODE: ${{ inputs.test || 'false' }}

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898308+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update appointment state"
            git push
          fi
